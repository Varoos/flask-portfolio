{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Projects</h1>
    <p>Here are some things I’ve built while learning Python.</p>

    {% for project in projects %}
        <div class="card">
            <h2>{{ project.title }}</h2>
            <p>{{ project.description }}</p>
            <p><strong>Tech:</strong> {{ project.tech }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
